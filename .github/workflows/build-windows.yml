# RC8 Windows CI refresh after the Qwen prompt/fixture update.
# RC8: Qwen citation and conservative classification tuning after RC7 laptop audit.
name: Vikora — собрать установщик Windows (RC8)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/rc4-ci-trigger.md'
      - '.github/workflows/build-windows.yml'
  push:
    paths:
      - 'Vikora_v1.4_RC3_Windows_ReleaseKit_source.zip'
      - '.github/workflows/build-windows.yml'
      - 'packaging/fix_rc4.py'
      - 'packaging/rc5_patch_zlib.b64'
      - 'packaging/rc6_patch_zlib.b64'
      - 'packaging/repair_ci_tests_rc6.py'
      - 'packaging/rc7_ollama_diagnostics.py'
      - 'packaging/rc8_qwen_evidence.py'
      - 'branding/vikora_logo_png.base64'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Проверить исходный ZIP
        shell: pwsh
        run: |
          $archive = 'Vikora_v1.4_RC3_Windows_ReleaseKit_source.zip'
          if (!(Test-Path $archive)) { throw "Отсутствует исходный архив: $archive" }
          $expected = 'a19791dd762ba718303c3253cfc80bf56f539c14e79951b631540f6906edb689'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Не совпала контрольная сумма архива: $actual" }
          Expand-Archive -Path $archive -DestinationPath . -Force
          if (!(Test-Path 'Vikora_1.4_RC3/pyproject.toml')) { throw 'Исходники не распакованы' }

      - name: Обновить smoke-проверку Windows
        shell: pwsh
        run: Copy-Item .github/scripts/windows_smoke.py Vikora_1.4_RC3/packaging/windows_smoke.py -Force

      - name: Обновить проверку установщика Windows
        shell: pwsh
        run: Copy-Item .github/scripts/test_installer_windows.ps1 Vikora_1.4_RC3/packaging/test_installer_windows.ps1 -Force

      - name: Установить Python 3.11 для сборки
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Применить исправление RC4 и фирменный значок
        shell: pwsh
        run: |
          python -m pip install 'Pillow>=10,<12'
          if ($LASTEXITCODE -ne 0) { throw 'Pillow could not be installed' }
          python packaging/fix_rc4.py Vikora_1.4_RC3
          if ($LASTEXITCODE -ne 0) { throw 'RC4 source patch failed' }

      - name: Применить исправление RC5 (повторный запуск и переход в Вакансии)
        shell: pwsh
        run: |
          python -c "import base64,zlib,pathlib; raw=pathlib.Path('packaging/rc5_patch_zlib.b64').read_text(encoding='ascii').strip(); pathlib.Path('packaging/fix_rc5.py').write_bytes(zlib.decompress(base64.b64decode(raw)))"
          if ($LASTEXITCODE -ne 0) { throw 'RC5 patch decode failed' }
          python packaging/fix_rc5.py Vikora_1.4_RC3
          if ($LASTEXITCODE -ne 0) { throw 'RC5 patch failed' }

      - name: Применить исправление RC6 (экспорт, оформление, скорость)
        shell: pwsh
        run: |
          python -c "import base64,zlib,pathlib; raw=pathlib.Path('packaging/rc6_patch_zlib.b64').read_text(encoding='ascii').strip(); pathlib.Path('packaging/fix_rc6.py').write_bytes(zlib.decompress(base64.b64decode(raw)))"
          if ($LASTEXITCODE -ne 0) { throw 'RC6 patch decode failed' }
          python packaging/fix_rc6.py Vikora_1.4_RC3
          if ($LASTEXITCODE -ne 0) { throw 'RC6 patch failed' }

      - name: Обновить тесты версии RC6
        shell: pwsh
        run: python packaging/repair_ci_tests_rc6.py Vikora_1.4_RC3

      - name: Применить RC7 (диагностика Qwen3, строгий формат ответов)
        shell: pwsh
        run: |
          python packaging/rc7_ollama_diagnostics.py Vikora_1.4_RC3
          if ($LASTEXITCODE -ne 0) { throw 'RC7 patch failed' }

      - name: Применить RC8 (точные цитаты и контекст навыков Qwen3)
        shell: pwsh
        run: |
          python packaging/rc8_qwen_evidence.py Vikora_1.4_RC3
          if ($LASTEXITCODE -ne 0) { throw 'RC8 patch failed' }

      - name: Проверить состав исходников
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: python packaging/verify_release_sources.py

      - name: Запустить тесты в Windows
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Установить компилятор установщика при необходимости
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось установить Inno Setup' }
          }

      - name: Собрать Vikora.exe и установщик
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: ./packaging/build_windows.ps1 -RequireInstaller

      - name: Проверить запуск собранного Vikora.exe
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: python packaging/windows_smoke.py --exe dist/Vikora/Vikora.exe

      - name: Проверить установку и переустановку
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: ./packaging/test_installer_windows.ps1

      - name: Записать SHA-256 установщика
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: |
          Get-FileHash dist/installer/Vikora_Setup_*.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)" | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii
          }

      - name: Предоставить установщик для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: vikora-windows-installer-test
          path: |
            Vikora_1.4_RC3/dist/installer/Vikora_Setup_*.exe
            Vikora_1.4_RC3/dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
