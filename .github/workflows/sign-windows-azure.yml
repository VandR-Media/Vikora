name: Vikora — подписанный Windows-установщик Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-installer:
    if: github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Проверить исходный ZIP
        shell: pwsh
        run: |
          $archive = 'Vikora_v1.4_RC3_Windows_ReleaseKit_source.zip'
          if (!(Test-Path $archive)) { throw "Отсутствует исходный архив: $archive" }
          $expected = 'a19791dd762ba718303c3253cfc80bf56f539c14e79951b631540f6906edb689'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Не совпала контрольная сумма архива: $actual" }
          Expand-Archive -Path $archive -DestinationPath . -Force
          if (!(Test-Path 'Vikora_1.4_RC3/pyproject.toml')) { throw 'Исходники не распакованы' }

      - name: Обновить smoke-проверку Windows
        shell: pwsh
        run: Copy-Item .github/scripts/windows_smoke.py Vikora_1.4_RC3/packaging/windows_smoke.py -Force

      - name: Обновить проверку установщика Windows
        shell: pwsh
        run: Copy-Item .github/scripts/test_installer_windows.ps1 Vikora_1.4_RC3/packaging/test_installer_windows.ps1 -Force

      - name: Установить Python 3.11 для сборки
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Применить исправление RC4 и фирменный значок
        shell: pwsh
        run: |
          python -m pip install 'Pillow>=10,<12'
          if ($LASTEXITCODE -ne 0) { throw 'Pillow could not be installed' }
          python packaging/fix_rc4.py Vikora_1.4_RC3
          if ($LASTEXITCODE -ne 0) { throw 'RC4 source patch failed' }

      - name: Проверить состав исходников
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: python packaging/verify_release_sources.py

      - name: Запустить тесты в Windows
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Установить компилятор установщика при необходимости
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось установить Inno Setup' }
          }

      - name: Собрать Vikora.exe и установщик
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: ./packaging/build_windows.ps1 -RequireInstaller

      - name: Проверить секреты и параметры Azure
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.VIKORA_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.VIKORA_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.VIKORA_SIGNING_PROFILE }}
        run: |
          foreach ($name in @('CLIENT_ID','TENANT_ID','SUBSCRIPTION_ID','SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing parameter: $name. Read docs/SIGNING_SETUP_RU.md"
            }
          }
          if (!$env:SIGNING_ENDPOINT.StartsWith('https://')) { throw 'Invalid Azure signing endpoint' }

      - name: Войти в Azure через OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Подписать Vikora.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.VIKORA_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.VIKORA_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.VIKORA_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\Vikora_1.4_RC3\dist\Vikora
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Проверить подпись Vikora.exe
        shell: pwsh
        run: |
          $file = 'Vikora_1.4_RC3/dist/Vikora/Vikora.exe'
          $signature = Get-AuthenticodeSignature -FilePath $file
          if ($signature.Status -ne 'Valid') { throw "App signature invalid: $($signature.Status)" }
          Write-Host "Publisher: $($signature.SignerCertificate.Subject)"

      - name: Пересобрать установщик с подписанной Vikora.exe
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'ISCC.exe not found' }
          & $compiler packaging\Vikora.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer repackage failed' }

      - name: Подписать установщик
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.VIKORA_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.VIKORA_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.VIKORA_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\Vikora_1.4_RC3\dist\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Проверить подпись установщика
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem 'Vikora_1.4_RC3/dist/installer/Vikora_Setup_*.exe')
          if ($setups.Count -ne 1) { throw 'Installer missing' }
          $signature = Get-AuthenticodeSignature -FilePath $setups[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature invalid: $($signature.Status)" }
          Write-Host "Publisher: $($signature.SignerCertificate.Subject)"

      - name: Проверить запуск собранного Vikora.exe
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: python packaging/windows_smoke.py --exe dist/Vikora/Vikora.exe

      - name: Проверить установку и переустановку
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: ./packaging/test_installer_windows.ps1

      - name: Записать SHA-256 установщика
        working-directory: Vikora_1.4_RC3
        shell: pwsh
        run: |
          Get-FileHash dist/installer/Vikora_Setup_*.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)" | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii
          }

      - name: Предоставить установщик для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: vikora-windows-signed-azure
          path: |
            Vikora_1.4_RC3/dist/installer/Vikora_Setup_*.exe
            Vikora_1.4_RC3/dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
